# Deterministic token-budget approximation (MVP-Implementation-Handoff.md §5, main document §28).
# Approximation method: ceil(characters / chars_per_token) — no tokenizer dependency in the MVP.
chars_per_token: 4

modes:
  efficient:
    context_selection_budget: 2000
  assurance:
    context_selection_budget: 4000

default_mode: efficient
